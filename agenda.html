<style>
:root{--bg:#f0f2f5;--card:#fff;--ink:#17212b;--mut:#5b6875;--line:#dde3e9;--acc:#0566c0;--acc2:#e4effa;--petro:#03313d;--azul:#0566c0;--azul2:#003a9c;--verde:#5cc021;--verde2:#0a9232;--warn:#a8590a;--warnbg:#fff3e2;--bad:#b3261e;--badbg:#fdecea;--ok:#0a7a2c;--okbg:#e5f4e3;--c0:#2b6cb0;--c1:#b7791f;--c2:#7b3fa0;--c3:#0e7490;--c4:#4d7c0f;--c5:#be185d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
#side{width:64px;flex:none;position:relative;z-index:30}
#sidei{position:fixed;left:0;top:0;bottom:0;width:64px;background:var(--petro);color:#fff;overflow-x:hidden;overflow-y:auto;transition:width .18s ease;white-space:nowrap;display:flex;flex-direction:column}
nav.lo{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:6px 0 10px}
nav .lb{opacity:0;transition:opacity .15s}
body.sp .lb{opacity:1}
body.sp #sidei{width:240px;box-shadow:4px 0 16px rgba(0,21,41,.25)}
.brand{height:64px;display:flex;align-items:center;padding:0 12px;margin-bottom:6px}
.brand .lc{width:40px;height:40px;display:block;flex:none;margin-left:0}.brand .lh{display:none;width:216px;height:auto;background:#fff;border-radius:8px;padding:8px 12px}
body.sp .brand .lc{display:none}body.sp .brand .lh{display:block}
nav{display:flex;flex-direction:column;gap:2px;padding:8px 0}
nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:14px 23px;font:inherit;font-size:14.5px;color:rgba(255,255,255,.82);cursor:pointer;text-align:left;width:100%}
nav button svg{flex:none;opacity:.9}nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav button.on{background:var(--azul);color:#fff;font-weight:600;box-shadow:inset 4px 0 0 var(--verde)}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
header .ysl{display:flex;align-items:center;gap:6px;margin:0 0 0 auto;font-weight:600;font-size:14px;color:var(--ink)}header .ysl select{width:auto;padding:5px 8px;font-weight:600}header .ysl+.pill{margin-left:0}header{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#0a9232,#5cc021 45%,#0566c0) 1;background:#fff;height:61px;padding:0 22px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 4px rgba(0,21,41,.08);position:sticky;top:0;z-index:10}
header .hb{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;display:flex}header .hb:hover{background:#f0f2f5}
header .ttl{font-weight:600;font-size:16px}header .dt{color:var(--mut);font-size:13.5px}
.pill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;background:#eef1f4;color:var(--mut)}
.pill.on{background:#d6f5e3;color:#14532d}.pill.off{background:#ffe3c2;color:#7a3e00}.pill.err{background:#fcd0cc;color:#7a0f08}
main{width:100%;max-width:1400px;margin:0 auto;padding:20px 22px 40px;flex:1}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-bottom:20px}
.kc{background:#fff;border-radius:6px;padding:20px 24px 12px;box-shadow:0 1px 2px rgba(0,21,41,.06);display:flex;flex-direction:column;min-height:196px}
.kc .kt{color:var(--mut);font-size:14px}.kc .kv{font-size:30px;color:#262626;margin:6px 0 4px;line-height:1.2}
.kc .kx{font-size:13.5px;color:var(--mut);display:flex;gap:6px;align-items:center;margin:2px 0}.kc .kx b{color:#262626}
.kc .kg{flex:1;display:flex;align-items:flex-end;min-height:48px}.kc .kg svg{width:100%;height:56px}
.kc .kf{border-top:1px solid #f0f0f0;padding-top:10px;margin-top:10px;font-size:14px;color:#262626}
.kc.ctr{align-items:center;justify-content:center;text-align:center}.kc.ctr .kv{font-size:34px}
.pn{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,21,41,.06);margin-bottom:20px}
.pn .ph{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 24px;border-bottom:1px solid #f0f0f0}
.pn .tab{border:0;background:none;font:inherit;padding:16px 14px;cursor:pointer;color:#262626;border-bottom:2px solid transparent;margin-bottom:-1px}
.pn .tab.on{color:var(--acc);border-color:var(--acc)}
.pn .per{border:0;background:none;font:inherit;padding:8px 10px;cursor:pointer;color:#595959}.pn .per.on{color:var(--acc)}.pn .per:hover{color:var(--acc)}
.pn .rg{display:flex;align-items:center;gap:6px;border:1px solid #d9d9d9;border-radius:6px;padding:2px 8px}.pn .rg input{border:0;padding:5px 2px;width:132px;background:none}.pn .rg input:focus{outline:none}
.pn .pb{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:40px;padding:22px 28px 26px}
@media(max-width:900px){.pn .pb{grid-template-columns:1fr;gap:20px}}
.pn h5{margin:0 0 14px;font-size:16px;font-weight:500;color:#262626}
.rk{display:flex;align-items:center;gap:14px;padding:9px 0;font-size:14.5px;color:#434343}.rk i{flex:none;width:20px;height:20px;border-radius:50%;background:#f0f2f5;color:#434343;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}
.rk.t i{background:#03313d;color:#fff}.rk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk b{font-weight:400;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:16px;font-size:12.5px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,21,41,.04)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
button.btn,a.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer}
button.btn:hover{background:#f0f3f6}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.pri:hover{background:#044f96}
button.dng{color:var(--bad);border-color:#f0c4c0}button.dng:hover{background:var(--badbg)}
button.sm{padding:4px 9px;font-size:13px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #c5cdd5;border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 3px;font-weight:600}
.dayhead h2{margin:0;font-size:22px}
.dayhead .meta{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.tag.hol{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.free{background:#eef1f4;color:var(--mut)}
.banner{background:var(--warnbg);color:#6b3a06;border:1px solid #f1d3a8;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.slot{cursor:pointer}tr.slot:hover td{background:#f7fafb}
tr.slot.closed{cursor:default;opacity:.55}tr.slot.closed:hover td{background:none}
.att{font-weight:600;white-space:nowrap}.att i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.time{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.empty{color:#97a3af;font-style:italic}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cal .h{font-size:12px;font-weight:700;color:var(--mut);text-align:center;text-transform:uppercase}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;min-height:78px;cursor:pointer;min-width:0}
.cal .d:hover{border-color:var(--acc)}.cal .d.hol{background:var(--warnbg);cursor:pointer}.cal .d.blank{border:0;background:none;cursor:default}

function maskRG(v){v=String(v||'').toUpperCase().replace(/[^0-9X]/g,'');const b=v.slice(0,7).replace(/\D/g,'');const d=b.length===7?v.slice(7,8):'';const g=[b.slice(0,1),b.slice(1,4),b.slice(4,7)].filter(Boolean).join('.');return g+(d?'-'+d:'')}
function maskCPF(v){v=v.replace(/\D/g,'').slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function maskCel(v){v=v.replace(/\D/g,'').slice(0,11);if(v.length<=10)return v.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d)/,'$1-$2');return v.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2')}
function cpfOk(v){v=v.replace(/\D/g,'');if(v.length!==11||/^(\d)\1+$/.test(v))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+v[i]*(t+1-i);if((s*10%11)%10!==+v[t])return false}return true}

}

async function lixoRestore(key){const x=lixo[key];if(!x)return;const st={ag,canc,cad,atd}[x.col];
  if(st[x.id]){toast('Já existe um registro com este código; não foi possível restaurar');return}

async function save(col,id,obj,quiet){
  if(window.__ro){if(col==='cfg'&&id==='feriados'){cfg[id]=obj;return true}toast('Perfil de consulta: somente visualização');return false}
  const store={ag,obs,canc,dia,cfg,cad,atd}[col];
  let prev=store[id];if(col==='cfg'&&!prev)prev=cfgBase(id);store[id]=obj;render();
  if(!db){localSave();logChange(col,id,prev,obj);savedToast();return true}
  try{await db.collection(col).doc(id).set(obj);logChange(col,id,prev,obj);savedToast();return true}catch(e){if(quiet){if(prev===undefined)delete store[id];else store[id]=prev;render();return false}setSync('err');toast('Não foi possível salvar. Verifique a conexão ou a permissão de edição.');return false}
}
async function del(col,id){
  if(window.__ro){toast('Perfil de consulta: somente visualização');return false}
  const store={ag,obs,canc,dia,cfg,cad,atd}[col];
  const prev=store[id];
  if(prev&&LX_COL[col]&&!(await lixoPut(col,id,prev))){toast('Não foi possível guardar na lixeira; a exclusão foi cancelada.');return false}

function cfgBase(id){return {feriados:{list:HOL_DEF},servicos:{list:SERV_DEF},escolas:{list:SCH_DEF},servidores:{list:srvList()},ausencias:{list:[]},padrao:{list:[]}}[id]}
let _lgK='Alteração';
const LOG_ONDE={ag:'Agendamento',canc:'Cancelado',obs:'Observação do dia',dia:'Horários do dia',cfg:'Configurações',cad:'Cadastro',atd:'Atendimento'};
const CFG_NOME={servicos:'Serviços',escolas:'Escolas',servidores:'Servidores',feriados:'Feriados / pontos facultativos',ausencias:'Atestado / Férias',padrao:'Padrão de Agenda'};
const lgShort=v=>{if(v==null||v==='')return '(vazio)';const t=typeof v==='object'?JSON.stringify(v):String(v);return t.length>50?t.slice(0,47)+'…':t};
const lgStamp=()=>{const d=new Date();return br(iso(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
function lgRef(col,id,r){
  if(col==='ag'||col==='canc')return br(r.date||id.slice(0,10))+' '+(r.time||'')+(r.att?' · '+r.att:'')+(r.nome?' · '+r.nome:'');
  if(col==='atd')return 'Protocolo '+(r.protocolo||id)+' · '+(r.nome||'')+' · CPF '+(r.cpf||'');
  if(col==='cad')return (r.nome||'')+' · CPF '+(r.cpf||id);
  if(col==='obs'||col==='dia')return br(id);
  return CFG_NOME[id]||id;
}
function lgItem(id,o){if(typeof o!=='object'||!o)return String(o);
  if(id==='ausencias')return (o.s!=null?attName(o.s):'')+' · '+(o.t||'')+' · '+(o.d?br(o.d):'')+(o.df&&o.df!==o.d?' a '+br(o.df):'')+(o.i||o.f?' · '+(o.i||'')+'–'+(o.f||''):'')+(o.st?' · '+o.st:'');
  if(id==='feriados')return br(o.d)+(o.i||o.f?' '+(o.i||'')+'–'+(o.f||''):'')+' · '+(o.t||'')+(o.x?' – '+o.x:'');
  if(id==='escolas')return (o.n||'')+(o.m?' ('+o.m+')':'');
  return o.n||o.nome||JSON.stringify(o).slice(0,50)}
function lgDiff(col,id,a,b){
  if(col==='cfg'){
    const la=(a&&a.list)||[],lb=(b&&b.list)||[];const out=[];
    const ka=la.map(x=>JSON.stringify(x)),kb=lb.map(x=>JSON.stringify(x));
    const add=lb.filter((x,i)=>!ka.includes(kb[i])),rem=la.filter((x,i)=>!kb.includes(ka[i]));
    _lgK=add.length&&!rem.length?'Inclusão':rem.length&&!add.length?'Exclusão':'Alteração';
    if(add.length&&rem.length&&add.length===rem.length)add.forEach((x,i)=>out.push('Alterado: '+lgItem(id,rem[i])+' → '+lgItem(id,add[i])));
    else{add.forEach(x=>out.push('Incluído: '+lgItem(id,x)));rem.forEach(x=>out.push('Removido: '+lgItem(id,x)))}
    if(id==='servidores'&&a&&b&&JSON.stringify(a.ex)!==JSON.stringify(b.ex))out.push('Servidores removidos do padrão alterados');
    return out.join(' | ')||'Configuração atualizada';
  }
  if(col==='dia'){const f=x=>((x&&x.slots)||[]).map(y=>y.time+' '+attName(y.att)).join(', ')||'(padrão)';return 'horários: '+f(a)+' → '+f(b)}
  if(!a)return Object.keys(b).filter(k=>!['id','date','idx','time','att','slotId'].includes(k)&&b[k]!==''&&b[k]!=null).slice(0,7).map(k=>k+': '+lgShort(b[k])).join(' | ');
  if(!b)return ['nome','servico','status'].filter(k=>a[k]).map(k=>k+': '+lgShort(a[k])).join(' | ');
  const keys=[...new Set(Object.keys(a).concat(Object.keys(b)))].filter(k=>k!=='id'&&JSON.stringify(a[k])!==JSON.stringify(b[k]));
  return keys.map(k=>k+': '+lgShort(a[k])+' → '+lgShort(b[k])).join(' | ');
}

function slotInfo(id){const d=id.slice(0,10);const k=+id.slice(11);return {date:d,...slotsFor(d).find(x=>x.idx===k)}}

/* importação única: pessoas dos agendamentos (e cancelados) que ainda não estão no Cadastro */
function cadAgPend(){
  const m={};
  Object.values(ag).concat(Object.values(canc)).forEach(r=>{if(!r||!r.nome)return;const dg=digits(r.cpf||'');if(dg.length!==11||!cpfOk(dg)||cad[dg])return;(m[dg]=m[dg]||[]).push(r)});
  const semCpf=new Set();Object.values(ag).concat(Object.values(canc)).forEach(r=>{if(r&&r.nome){const dg=digits(r.cpf||'');if(dg.length!==11||!cpfOk(dg))semCpf.add(norm(r.nome))}});
  return {m,semCpf:semCpf.size};
}
async function cadImportAg(){
  if(window.__ro){toast('Perfil de consulta: somente visualização');return}
  if(db&&!loaded.cad){toast('Aguarde o carregamento do Cadastro');return}

  if(!ks.length){toast('Nenhuma pessoa nova para importar'+(semCpf?' · '+semCpf+' sem CPF válido':''));return}

function relDefaults(){return {done:false,noFrom:true,from:FIRST,to:LAST,toEmpty:true,att:'',por:'',serv:'',proc:'',q:'',sit:'ocupados',st:''}}
function relQ(r,s,d,q){const t=norm([d,s&&s.time,s&&attName(s.att),...Object.values(r||{}).filter(v=>typeof v!=='object')].join(' | '));const td=digits(t);return q.split(/\s+/).filter(Boolean).every(w=>t.includes(norm(w))||(digits(w).length>=3&&td.includes(digits(w))))}
const procTxt=r=>r&&r.proc?[r.procNome,r.procEmail,r.procTel].filter(Boolean).join(' · '):'';
const rowAtt=y=>y.cn?(y.r.att||''):attName(y.s.att);
const rowSt=y=>y.cn?(y.r.nc?'Não compareceu':'Cancelado'+(y.r.retorno==='Reagendado'?' · Reagendado':' · Pendente')):stOf(y.r);
const rowObs=y=>y.cn&&y.r.nc?[y.r.observacao,'Não compareceu'+(y.r.ncPor?' (registrado por '+y.r.ncPor+(y.r.ncEm?' em '+y.r.ncEm:'')+')':'')].filter(Boolean).join(' | '):y.cn?[y.r.observacao,'Cancelado por '+(y.r.canceladoPor||'—')+(y.r.canceladoEm?' em '+y.r.canceladoEm:'')+(y.r.motivo?' — '+y.r.motivo:'')+(y.r.retorno==='Reagendado'&&y.r.reagDate?' · Reagendado para '+br(y.r.reagDate)+' '+(y.r.reagTime||''):'')].filter(Boolean).join(' | '):y.r.observacao;
function relRows(f){
  const rows=[];let d=f.from;let free=0,occ=0;const days=[];
  while(d<=f.to){
    if(isWeekday(d)){const h=HOL[d];const dayRows=[];
      if(!h)slotsFor(d).forEach(s=>{const r=ag[s.id];if(r)occ++;else if(!s.blk)free++;
        if(f.att&&attName(s.att)!==f.att)return;if(f.por&&(!r||r.por!==f.por))return;if(f.serv&&(!r||norm(r.servico)!==norm(f.serv)))return;
        if(f.st&&(!r||stOf(r)!==f.st))return;if(f.proc&&(!r||(f.proc==='Sim')!==!!r.proc))return;if(f.q&&f.q.trim()&&(!r||!relQ(r,s,d,f.q)))return;if(f.sit==='ocupados'&&!r)return;if(f.sit==='livres'&&(r||s.blk))return;dayRows.push({s,r})});

        cs.forEach(c=>dayRows.push({s:{time:c.time,att:null},r:c,cn:true}))}

  const H=v=>{const t=String(v==null?'':v);if(!Q)return esc(t);const nt=norm(t);if(nt.length!==t.length)return esc(t);const ws=Q.split(/\s+/).filter(Boolean).map(norm);const m=new Array(t.length).fill(0);ws.forEach(w=>{let i=nt.indexOf(w);while(i>=0&&w){for(let k=i;k<i+w.length;k++)m[k]=1;i=nt.indexOf(w,i+w.length)}});let o='',on=0;for(let k=0;k<t.length;k++){if(m[k]&&!on){o+='<mark>';on=1}if(!m[k]&&on){o+='</mark>';on=0}o+=esc(t[k])}if(on)o+='</mark>';return o};

function hpSet(p){

  if(p==='dia'){from=to=d}

  else if(p==='mes'){const y=+d.slice(0,4),mo=+d.slice(5,7);from=d.slice(0,7)+'-01';to=d.slice(0,7)+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0')}
  S.hp={p,from,to};
}
function homeBuckets(from,to,LL){
  const days=Math.round((dObj(to)-dObj(from))/864e5)+1;
  const mode=days===1?'t':days<=45?'d':'m';
  const key=(d,t)=>mode==='t'?t:mode==='d'?d.slice(8)+'/'+d.slice(5,7):MES[+d.slice(5,7)-1].slice(0,3);
  const cats=new Map();const mk=k=>{if(!cats.has(k))cats.set(k,{k,agd:0,atd:0,can:0,occ:0,free:0,blk:0});return cats.get(k)};
  let d=from,g=0;
  while(d<=to&&g++<4000){
    if(isWeekday(d)){
      if(mode!=='t')mk(key(d,''));
      if(!HOL[d])slotsFor(d).forEach(sl=>{const c=mk(key(d,sl.time));if(ag[sl.id])c.occ++;else if(sl.blk)c.blk++;else c.free++});
    }
    d=addDays(d,1)}
  if(mode==='t')[...cats.keys()].sort().forEach(k=>{const v=cats.get(k);cats.delete(k);cats.set(k,v)});
  if(LL){LL.forEach(r=>{const c=cats.get(key(r.date,r.time));if(c){if(r._st==='Não compareceu'){}else if(r._st==='Cancelado')c.can++;else if(r._st==='Atendido')c.atd++;else c.agd++}});return [...cats.values()]}
  Object.values(ag).forEach(r=>{if(r.date>=from&&r.date<=to){const c=cats.get(key(r.date,r.time));if(c){if(stOf(r)==='Atendido')c.atd++;else c.agd++}}});
  Object.values(canc).forEach(r=>{if(!r.nc&&r.date>=from&&r.date<=to){const c=cats.get(key(r.date,r.time));if(c)c.can++}});

function svgBars(cats,series,H){
  const W=720,L=34,B=26,T=10,h=H-B-T;

  const step=mx<=5?1:mx<=10?2:mx<=25?5:mx<=50?10:mx<=100?20:Math.pow(10,Math.floor(Math.log10(mx)))*(mx/Math.pow(10,Math.floor(Math.log10(mx)))>5?2:1);
  const top=Math.ceil(mx/step)*step;

  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:860px;display:block" role="img" aria-label="Gráfico de barras">`;
  for(let v=0;v<=top;v+=step){const y=T+h-v/top*h;o+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#f0f0f0"/><text x="${L-6}" y="${y+4}" font-size="11" fill="#8c8c8c" text-anchor="end">${v}</text>`}
  cats.forEach((c,i)=>{
    const x0=L+i*gw+(gw-bw*series.length)/2;
    series.forEach((s,j)=>{const v=s.f(c),bh=v/top*h;o+=`<rect x="${x0+j*bw}" y="${T+h-bh}" width="${bw-1}" height="${bh}" fill="${s.c}"><title>${esc(c.k)} · ${s.n}: ${v}</title></rect>`});
    if(cats.length<=16||i%Math.ceil(cats.length/16)===0)o+=`<text x="${L+i*gw+gw/2}" y="${H-8}" font-size="11" fill="#595959" text-anchor="middle">${esc(c.k)}</text>`;
  });
  return o+'</svg>';
}

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line} L${W} ${H} L0 ${H} Z" fill="${color}" opacity=".35"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}

function ausConflicts(a){

}

async function editFer(i,f,val){
  const l=ferList().slice().sort(ferCmp).map(x=>({...x}));val=(val||'').trim();
  const e=l[i];if(!e)return;
  if(f==='d'&&(!val||val<FIRST||val>LAST)){toast(`Informe uma data de ${Y0} a ${Y1}`);render();return}
  if((e[f]||'')===val)return;
  const n={...e,[f]:val};
  if(n.i&&n.f&&n.f<=n.i){toast('O horário de fim deve ser depois do início');render();return}
  {const ov=ferOverlap(n,l,i);if(ov.length){render();openFerDup(n,ov);return}}
  if(!n.i)delete n.i;if(!n.f)delete n.f;
  if(f!=='t'&&f!=='x'){const c=ferConflicts(n);if(c.length){render();openFerBlock(n,c);return}}
  l[i]=n;await saveFer(l);
}
async function addFer(){
  const d=$('#fe_d').value,t=$('#fe_t').value,x=$('#fe_x').value.trim(),i=$('#fe_i').value,f=$('#fe_f').value;
  if(!d||d<FIRST||d>LAST){toast(`Informe a data (de ${Y0} a ${Y1})`);return}
  if(i&&f&&f<=i){toast('O horário de fim deve ser depois do início');return}
  const l=ferList().slice().sort(ferCmp).map(e=>({...e}));
  const n={d,t,x};if(i)n.i=i;if(f)n.f=f;
  {const ov=ferOverlap(n,l,-1);if(ov.length){openFerDup(n,ov);return}}
  const c=ferConflicts(n);if(c.length){openFerBlock(n,c);return}
  l.push(n);await saveFer(l);toast('Incluído');
}

function padConflicts(list,from){
  const pf=dt=>{let b=null;for(const v of list)if(v.from<=dt&&(!b||v.from>=b.from))b=v;return b?{std:b.std,fri:b.fri}:{std:T_STD,fri:T_FRI}};
  const out=[];
  for(const r of Object.values(ag)){const dt=r.date;if(!dt||dt<from)continue;
    if(dia[dt]&&Array.isArray(dia[dt].slots))continue;
    const pt=pf(dt)[wdOf(dt)===5?'fri':'std'];
    if(!pt.some(x=>x[0]===r.time&&attName(x[1])===r.att))out.push(r)}
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function padAlert(c,acao){return new Promise(res=>{
  const w=document.createElement('div');w.className='modalbg on';w.style.zIndex=45;w.style.alignItems='center';
  const lin=c.slice(0,12).map(r=>`<li>${br(r.date)} · ${esc(r.time)} · ${esc(r.att||'')} · ${esc(r.nome||'(sem nome)')}</li>`).join('');
  w.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" style="max-width:520px"><h3 style="margin-top:0;color:#b42318">Atenção: há agendas em conflito</h3><p style="font-size:15px">${c.length===1?'Existe 1 agendamento já realizado':'Existem '+c.length+' agendamentos já realizados'} em horário ou atendente que não consta no novo padrão:</p><ul style="font-size:14px;max-height:220px;overflow:auto;padding-left:20px">${lin}</ul>${c.length>12?`<p style="font-size:13px;color:var(--mut)">… e mais ${c.length-12}.</p>`:''}<p style="font-size:14px;color:var(--mut)">Esses agendamentos serão mantidos como estão (horário e atendente originais); apenas os dias sem agendamento seguem o novo padrão.</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-y="0">Voltar</button><button class="btn pri" type="button" data-y="1">${acao}</button></div></div>`;
  const end=v=>{w.remove();document.removeEventListener('keydown',kk,true);res(v)};
  const kk=e=>{if(e.key==='Escape'){e.stopPropagation();end(false)}};
  document.addEventListener('keydown',kk,true);
  w.addEventListener('click',e=>{const b=e.target.closest('[data-y]');if(b)end(b.dataset.y==='1')});
  document.body.appendChild(w)})}
async function padFreeze(from,oldFn){
  /* congela o padrão anterior nos dias a partir da vigência que já têm agendamento, para não desalinhar os cadastros */
  const ds=new Set();for(const r of Object.values(ag))if(r.date&&r.date>=from)ds.add(r.date);
  for(const r of Object.values(canc))if(r.date&&r.date>=from)ds.add(r.date);
  let n=0;for(const d of ds){if(dia[d]&&Array.isArray(dia[d].slots))continue;
    const old=oldFn(d);await save('dia',d,{...(dia[d]||{}),slots:old.map(x=>({k:x.idx,time:x.time,att:x.att}))});n++}
  return n;
}
async function padSave(){
  padSync();const d=S.pd;
  if(!d.from||d.from<padMin()){toast('A vigência não pode ser anterior a hoje');return}
  for(const g of ['std','fri']){const t=d[g].map(x=>x[0]);if(!t.length){toast('Inclua ao menos um horário em '+(g==='fri'?'sexta-feira':'segunda a quinta'));return}
    const k=d[g].map(x=>x[0]+'|'+x[1]);if(new Set(k).size!==k.length){toast('Há horário repetido para a mesma atendente');return}}
  const nl=padList().filter(v=>v.from!==d.from).concat({from:d.from,std:d.std.slice().sort((a,b)=>a[0].localeCompare(b[0])||a[1]-b[1]),fri:d.fri.slice().sort((a,b)=>a[0].localeCompare(b[0])||a[1]-b[1])});
  const cf=padConflicts(nl,d.from);
  if(cf.length&&!await padAlert(cf,'Salvar mesmo assim'))return;
  const ok=await askYesNo('Salvar o novo padrão de agenda?','O padrão passa a valer a partir de '+br(d.from)+' para todos os dias seguintes. Dias com agendamento já feito não são alterados.');
  if(!ok)return;
  const srt=l=>l.slice().sort((a,b)=>a[0].localeCompare(b[0])||a[1]-b[1]);
  const prev=padraoFor;const snap={};const oldFn=dt=>{if(!snap[dt])snap[dt]=slotsRaw(dt);return snap[dt]};
  const keys=new Set();for(const r of Object.values(ag))if(r.date&&r.date>=d.from)keys.add(r.date);for(const r of Object.values(canc))if(r.date&&r.date>=d.from)keys.add(r.date);
  for(const k of keys)oldFn(k);
  const l=padList().filter(v=>v.from!==d.from).concat({from:d.from,std:srt(d.std),fri:srt(d.fri)}).sort((a,b)=>a.from.localeCompare(b.from));
  await save('cfg','padrao',{list:l});
  const n=await padFreeze(d.from,dt=>snap[dt]||[]);
  S.pd=null;render();toast('Padrão salvo a partir de '+br(d.from)+(n?' · '+n+' dia(s) com agendamento mantido(s)':''));
}
async function padDel(from){
  const cf=padConflicts(padList().filter(v=>v.from!==from),from);
  if(cf.length&&!await padAlert(cf,'Excluir mesmo assim'))return;
  const ok=await askYesNo('Tem certeza que deseja excluir este padrão?','O padrão com vigência a partir de '+br(from)+' será removido e os dias voltam ao padrão anterior. Dias com agendamento não são alterados.');
  if(!ok)return;
  const snap={};const keys=new Set();for(const r of Object.values(ag))if(r.date&&r.date>=from)keys.add(r.date);for(const r of Object.values(canc))if(r.date&&r.date>=from)keys.add(r.date);
  for(const k of keys)snap[k]=slotsRaw(k);
  await save('cfg','padrao',{list:padList().filter(v=>v.from!==from)});
  await padFreeze(from,dt=>snap[dt]||[]);
  S.pd=null;render();toast('Padrão excluído');
}

  for(const r of Object.values(canc))if(r.att===old||r.por===old||r.canceladoPor===old){await save('canc',r.id,{...r,att:r.att===old?nv:r.att,por:r.por===old?nv:r.por,canceladoPor:r.canceladoPor===old?nv:r.canceladoPor});n++}

async function reagendar(id){
  const c=canc[id];const g=(S.rg||{})[id]||{};if(!c)return;
  const sl=g.date&&g.sid?slotsFor(g.date).find(x=>x.id===g.sid):null;
  if(!sl){toast('Escolha a nova data e o horário');return}
  if(ag[sl.id]){toast('Esse horário acabou de ser ocupado; escolha outro');render();return}
  if(sl.blk){toast(sl.blk.feriado?'Horário sem atendimento: '+sl.blk.t:'Horário bloqueado: '+sl.blk.t+' de '+attName(sl.att));render();return}
  const {canceladoPor,motivo,canceladoEm,retorno,slotId,reagDate,reagTime,reagAtt,reagSlot,reagEm,...rec}=c;
  rec.id=sl.id;rec.date=g.date;rec.idx=sl.idx;rec.time=sl.time;rec.att=attName(sl.att);rec.status='Reagendado';
  const nota='Reagendado de '+br(c.date)+' '+c.time;rec.observacao=c.observacao?c.observacao+' · '+nota:nota;
  if(await save('ag',sl.id,rec)){await save('canc',id,{...c,retorno:'Reagendado',reagDate:g.date,reagTime:sl.time,reagAtt:attName(sl.att),reagSlot:sl.id,reagEm:nowStr()});delete S.rg[id];toast('Reagendado para '+br(g.date)+' às '+sl.time+' com '+attName(sl.att));render()}
}
function cancCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const l=[['Status','Nova data','Novo horário','Novo servidor','Nome','Sexo','Cargo','Celular','Estava agendado para o dia','Horário','Atendente','Serviço','Escola','Município da escola','E-mail da escola','Motivo','Observação','Cancelado por','RG','CPF','E-mail','Agendado por','Cancelado em'].map(q).join(';')];
  Object.values(canc).filter(c=>c&&!c.nc).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(c=>l.push([retOf(c),c.reagDate?br(c.reagDate):'',c.reagTime,c.reagAtt,c.nome,c.sexo,c.cargo,c.cel,br(c.date),c.time,c.att,c.servico,c.escola,c.escolaMun,c.escolaEmail,c.motivo,c.observacao,c.canceladoPor,c.rg,c.cpf,c.email,c.por,c.canceladoEm].map(q).join(';')));
  return '﻿'+l.join('\r\n');
}
async function restoreCanc(id){
  const c=canc[id];if(!c)return;
  const sid=c.slotId||(c.date+'_'+c.idx);
  const slot=slotsFor(c.date).find(x=>x.id===sid);
  if(!slot||ag[sid]){toast('O horário original não está livre; cadastre em outro horário');return}
  if(slot.blk){toast(slot.blk.feriado?'Horário sem atendimento: '+slot.blk.t+(slot.blk.o?' – '+slot.blk.o:''):'Horário bloqueado: '+slot.blk.t+' de '+attName(slot.att));return}
  const {canceladoPor,motivo,canceladoEm,retorno,slotId,reagDate,reagTime,reagAtt,reagSlot,reagEm,...rec}=c;
  rec.id=sid;rec.status='Agendado';
  if(await save('ag',sid,rec)){await del('canc',id);toast('Agendamento restaurado em '+br(c.date)+' '+c.time)}
}

}

let _sugI=-1,_sugL=[];
function sugList(txt){
  const words=txt.split(/\s+/);const w=words[words.length-1];const nw=norm(w),dw=digits(w);
  if(!nw)return {w,list:[]};
  const seen=new Map();
  const add=(v,tp)=>{v=String(v||'').trim();if(!v)return;const k=norm(v);if(seen.has(k))return;
    const nv=k,hit=nv.includes(nw)||(dw.length>=3&&digits(v).includes(dw));if(hit)seen.set(k,{v,tp,pre:nv.startsWith(nw)||nv.split(/\s+/).some(x=>x.startsWith(nw))})};
  Object.values(ag).concat(Object.values(canc)).forEach(r=>{if(!r)return;add(r.nome,'Nome');add(r.cpf,'CPF');add(r.rg,'RG');add(r.email,'E-mail');add(r.cel,'Celular');add(r.escola,'Escola');add(r.cargo,'Cargo');add(r.servico,'Serviço');add(r.por,'Agendado por');if(r.proc){add(r.procNome,'Procurador');add(r.procEmail,'E-mail do procurador');add(r.procTel,'Telefone do procurador')}});
  attNames().forEach(a=>add(a,'Atendente'));
  const list=[...seen.values()].sort((a,b)=>(b.pre-a.pre)||a.v.localeCompare(b.v)).slice(0,8);
  return {w,list};
}
function sugShow(){
  const inp=$('#r_q'),box=$('#r_sug');if(!inp||!box)return;
  const {w,list}=sugList(inp.value);_sugL=list;_sugI=-1;
  if(!list.length){box.hidden=true;box.innerHTML='';return}
  const hl=v=>{const i=norm(v).indexOf(norm(w));if(i<0||norm(v).length!==v.length)return esc(v);return esc(v.slice(0,i))+'<mark>'+esc(v.slice(i,i+w.length))+'</mark>'+esc(v.slice(i+w.length))};
  box.innerHTML=list.map((x,i)=>`<div data-sug="${i}"><span>${hl(x.v)}</span><small>${x.tp}</small></div>`).join('');box.hidden=false;
}
function sugPick(i){
  const inp=$('#r_q');const x=_sugL[i];if(!inp||!x)return;
  const words=inp.value.split(/\s+/);words.pop();inp.value=(words.concat(x.v).join(' ')).trim();
  const box=$('#r_sug');if(box)box.hidden=true;relSearch();
}

document.addEventListener('keydown',e=>{if(!e.target||e.target.id!=='r_q')return;const box=$('#r_sug');if(!box||box.hidden)return;

  if(e.key==='ArrowDown'){e.preventDefault();mv(1)}else if(e.key==='ArrowUp'){e.preventDefault();mv(-1)}
  else if(e.key==='Enter'&&_sugI>=0){e.preventDefault();e.stopImmediatePropagation();sugPick(_sugI)}

    window.__fsdb = {
      collection: (n) => ({
        doc: (id) => ({
          set: (o) => setDoc(doc(fdb, nome(n), id), o),
          delete: () => deleteDoc(doc(fdb, nome(n), id))
        }),
        onSnapshot: (h, er) => onSnapshot(collection(fdb, nome(n)), h, er)
      })
    };
    initDb();
    $g("gate").remove();
    if (window.__ro) { const t = document.getElementById("sync"); if (t) t.title = "Perfil de consulta: somente visualização"; }
  } catch (e) {
    console.error(e);
    $g("gateMsg").textContent = "Não foi possível abrir o sistema.";
    $g("gateSub").innerHTML = String(e.message || e) + ' <a href="./" style="color:#9A3B1E">Voltar ao início</a>';
  }
});
</script>
</body>
</html>
