<style>
  :root {
    --bg: #eef2f5;
    --card: #ffffff;
    --tinta: #16222b;
    --suave: #5b6b77;
    --linha: #d9e1e7;
    --primaria: #0f5c7a;
    --primaria-esc: #0b4760;
    --perigo: #b3261e;
    --ok: #1b6e3c;
    --raio: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--tinta);
    line-height: 1.45;
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }

  /* Telas centrais (login, verificação, erro) */
  .centro { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .caixa { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 28px 26px; box-shadow: 0 8px 28px rgba(15, 40, 55, .08); }
  .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .marca .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--primaria); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .marca-logo { text-align: center; margin-bottom: 20px; }
  .marca-logo img { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto 10px; }
  .marca-logo h1 { font-size: 18px; margin: 0; line-height: 1.2; }
  .marca-logo small { color: var(--suave); display: block; font-size: 12.5px; margin-top: 2px; }
  .logo-topo { height: 40px; width: auto; display: block; }
  .marca h1 { font-size: 18px; margin: 0; line-height: 1.2; }
  .marca small { color: var(--suave); display: block; font-size: 12.5px; }
  h2 { font-size: 17px; margin: 0 0 14px; }
  p { margin: 0 0 12px; }
  .suave { color: var(--suave); font-size: 14px; }

  .abas-login { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; margin-bottom: 18px; }
  .abas-login button { border: 0; background: transparent; padding: 9px; border-radius: 8px; font: inherit; font-weight: 600; color: var(--suave); cursor: pointer; }
  .abas-login button.ativa { background: #fff; color: var(--primaria); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  label { display: block; font-size: 13.5px; font-weight: 600; margin: 0 0 5px; }
  input, select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 8px; background: #fff; color: var(--tinta); }
  input:focus, select:focus, button:focus-visible { outline: 3px solid rgba(15, 92, 122, .28); border-color: var(--primaria); }
  .campo { margin-bottom: 14px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 11px 16px; background: var(--primaria); color: #fff; cursor: pointer; width: 100%; }
  .btn:hover { background: var(--primaria-esc); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn-sec { width: auto; padding: 8px 14px; background: #fff; color: var(--primaria); border: 1px solid var(--linha); }
  .btn-sec:hover { background: var(--bg); }
  .btn-perigo { width: auto; padding: 6px 10px; background: #fff; color: var(--perigo); border: 1px solid #e3b9b6; font-size: 13px; }
  .btn-perigo:hover { background: #fdf1f0; }
  .btn-link { background: none; border: 0; color: var(--primaria); font: inherit; font-size: 14px; cursor: pointer; padding: 0; text-decoration: underline; }

  .msg { font-size: 14px; border-radius: 8px; padding: 10px 12px; margin: 12px 0 0; display: none; }
  .msg.erro { display: block; background: #fdf1f0; color: var(--perigo); border: 1px solid #f0c9c6; }
  .msg.ok { display: block; background: #eef8f1; color: var(--ok); border: 1px solid #c6e6d0; }
  .msg.info { display: block; background: #eef4f8; color: var(--primaria-esc); border: 1px solid #cfe0ea; }
  .linha-links { display: flex; justify-content: space-between; margin-top: 14px; }
  .acoes { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

  /* Aplicação */
  .topo { background: var(--card); border-bottom: 1px solid var(--linha); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .topo .marca { margin: 0; }
  .usuario { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .usuario .nome { font-weight: 600; }
  .selo { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .selo-admin { background: #e7e2f8; color: #46318f; }
  .selo-coordenador { background: #dff1ea; color: #1b6e3c; }
  .selo-consulta { background: #e5edf3; color: #2f5671; }
  .abas { display: flex; gap: 4px; padding: 10px 20px 0; background: var(--card); border-bottom: 1px solid var(--linha); }
  .abas button { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--suave); padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; }
  .abas button.ativa { color: var(--primaria); border-bottom-color: var(--primaria); }
  main { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 22px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 20px; margin-bottom: 18px; }
  .grade { display: grid; grid-template-columns: 1.2fr 1.4fr 1fr 1.2fr auto; gap: 12px; align-items: end; }
  .un-cel { display: flex; gap: 8px; align-items: center; min-width: 230px; }
  .un-cel select { flex: 1; }
  .un-cel .btn { width: auto; flex: none; padding: 7px 14px; }
  .un-cel .btn:disabled { opacity: .45; cursor: default; }
  .grade .btn { width: auto; }
  .modulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .modulo { display: block; border: 1px solid var(--linha); border-radius: 10px; padding: 14px; text-decoration: none; color: inherit; background: #fff; }
  .modulo:hover { border-color: var(--primaria); box-shadow: 0 2px 10px rgba(15, 92, 122, .12); }
  .modulo strong { display: block; color: var(--primaria); margin-bottom: 4px; }
  .rolagem { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linha); vertical-align: middle; }
  th { font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); }
  td select { padding: 6px 8px; min-width: 140px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .tag-ok { background: #eef8f1; color: var(--ok); }
  .tag-espera { background: #fff6e0; color: #8a5a00; }
  footer { text-align: center; color: var(--suave); font-size: 12.5px; padding: 14px; }

  .fundo { position: fixed; inset: 0; background: rgba(10, 25, 35, .5); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal { background: #fff; border-radius: var(--raio); padding: 22px; max-width: 420px; width: 100%; }
  .modal .acoes-modal { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .modal .btn { width: auto; }

  @media (max-width: 760px) {
    .grade { grid-template-columns: 1fr; }
    .grade .btn { width: 100%; }
    .topo { padding: 10px 14px; }
  }
</style>
</head>

    "auth/too-many-requests": "Muitas tentativas. Aguarde alguns minutos e tente de novo.",
    "auth/network-request-failed": "Sem conexão com a internet. Tente novamente.",
    "auth/user-disabled": "Esta conta foi desativada.",
    "permission-denied": "Você não tem permissão para esta ação."
  };
  return mapa[c] || "Não foi possível concluir. Tente novamente.";
}

function confirmar(titulo, texto, rotulo) {
  return new Promise((resolve) => {
    const f = document.createElement("div");
    f.className = "fundo";
    f.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p>
      <div class="acoes-modal"><button class="btn btn-sec" data-r="0">Cancelar</button><button class="btn" data-r="1">${esc(rotulo)}</button></div></div>`;
    f.addEventListener("click", (ev) => {
      const r = ev.target.getAttribute && ev.target.getAttribute("data-r");
      if (r === null || r === undefined) { if (ev.target === f) { f.remove(); resolve(false); } return; }
      f.remove(); resolve(r === "1");
    });
    document.body.appendChild(f);
  });
}

}

let criandoConta = false; // enquanto verdadeiro, o login automático da criação não troca de tela
function telaAuth(modo) {
  const entrar = modo === "entrar", criar = modo === "criar", recuperar = modo === "recuperar";
  root.innerHTML = `
  <div class="centro"><div class="caixa">
    ${marcaHtml("Entre com seu usuário e senha")}
    ${recuperar ? "" : `<div class="abas-login">
      <button type="button" data-modo="entrar" class="${entrar ? "ativa" : ""}">Entrar</button>
      <button type="button" data-modo="criar" class="${criar ? "ativa" : ""}">Criar conta</button></div>`}
    <form id="f-auth" novalidate>
      ${recuperar ? `<h2>Recuperar senha</h2><p class="suave">Informe seu usuário ou o e-mail da conta. Enviaremos um link para criar uma nova senha.</p>` : ""}
      ${criar ? `<div class="campo"><label for="nome">Nome completo</label><input id="nome" autocomplete="name" required></div>` : ""}
      ${criar ? `<div class="campo"><label for="unidade">Unidade</label><select id="unidade" required><option value="">Selecione…</option>${UNIDADES.map((u) => `<option value="${u}">${u}</option>`).join("")}</select></div>` : ""}
      ${criar ? `<div class="campo"><label for="usuario">Nome de usuário</label><input id="usuario" autocomplete="username" autocapitalize="none" placeholder="ex.: maria.pezente" required><small class="suave">Use letras minúsculas, números, ponto, hífen ou sublinhado (de 3 a 30 caracteres). É com ele que você vai entrar. Se o administrador já definiu um usuário para o seu e-mail, ele será o usado.</small></div>` : ""}
      <div class="campo"><label for="email">${criar ? "E-mail (liberado pelo administrador)" : "Usuário ou e-mail"}</label><input id="email" ${criar ? 'type="email" autocomplete="email"' : 'type="text" autocomplete="username" autocapitalize="none"'} required></div>
      ${recuperar ? "" : `<div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="${criar ? "new-password" : "current-password"}" required></div>`}
      ${criar ? `<div class="campo"><label for="senha2">Repita a senha</label><input id="senha2" type="password" autocomplete="new-password" required></div>
        <p class="suave">Só e-mails liberados pelo administrador conseguem acesso ao sistema.</p>` : ""}
      <button class="btn" id="enviar" type="submit">${entrar ? "Entrar" : criar ? "Criar conta" : "Enviar link"}</button>
      <div id="msg" class="msg" role="alert"></div>
    </form>
    <div class="linha-links">
      ${entrar ? `<button type="button" class="btn-link" data-modo="recuperar">Esqueci minha senha</button><span></span>` : ""}
      ${recuperar ? `<button type="button" class="btn-link" data-modo="entrar">Voltar ao login</button><span></span>` : ""}
    </div>
  </div></div>${rodape}`;

  root.querySelectorAll("[data-modo]").forEach((b) => b.addEventListener("click", () => telaAuth(b.dataset.modo)));
  const form = root.querySelector("#f-auth");
  const msg = root.querySelector("#msg");
  const btn = root.querySelector("#enviar");

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    let email = form.email.value.trim().toLowerCase();
    if (criar && !emailValido(email)) return aviso(msg, "erro", "Informe um e-mail válido.");
    if (!criar && !email) return aviso(msg, "erro", "Informe seu usuário ou e-mail.");
    btn.disabled = true;
    try {
      // Usuário no lugar do e-mail: descobre o e-mail da conta
      if (!criar && !email.includes("@")) {
        const l = await getDoc(doc(db, "logins", email));
        if (!l.exists()) {
          if (recuperar) { aviso(msg, "ok", "Se este usuário tiver conta, o link de recuperação foi enviado. Confira também o spam."); btn.disabled = false; return; }
          btn.disabled = false; return aviso(msg, "erro", "Usuário ou senha incorretos.");
        }
        email = l.data().email;
      }
      if (entrar) {
        if (!form.senha.value) { btn.disabled = false; return aviso(msg, "erro", "Informe a senha."); }
        await signInWithEmailAndPassword(auth, email, form.senha.value);
      } else if (criar) {
        const nome = form.nome.value.trim();
        if (nome.length < 3) { btn.disabled = false; return aviso(msg, "erro", "Informe seu nome completo."); }
        if (form.senha.value.length < 6) { btn.disabled = false; return aviso(msg, "erro", "A senha precisa ter pelo menos 6 caracteres."); }
        if (form.senha.value !== form.senha2.value) { btn.disabled = false; return aviso(msg, "erro", "As senhas não conferem."); }
        const unidade = form.unidade.value;
        if (!UNIDADES.includes(unidade)) { btn.disabled = false; return aviso(msg, "erro", "Selecione a sua unidade."); }
        const usuarioNome = form.usuario.value.trim().toLowerCase();
        if (!/^[a-z0-9._-]{3,30}$/.test(usuarioNome)) { btn.disabled = false; return aviso(msg, "erro", "Usuário inválido. Use de 3 a 30 caracteres: letras minúsculas, números, ponto, hífen ou sublinhado."); }
        if ((await getDoc(doc(db, "logins", usuarioNome))).exists()) { btn.disabled = false; return aviso(msg, "erro", "Este nome de usuário já está em uso. Escolha outro."); }
        criandoConta = true;
        const cred = await createUserWithEmailAndPassword(auth, email, form.senha.value);
        try {
          // se o administrador já definiu o usuário deste e-mail, ele prevalece sobre o digitado
          let usuFinal = usuarioNome;
          try {
            const au = await getDoc(doc(db, "autorizados", email));
            const def = au.exists() ? String(au.data().usuario || "").toLowerCase() : "";
            if (/^[a-z0-9._-]{3,30}$/.test(def) && !(await getDoc(doc(db, "logins", def))).exists()) usuFinal = def;
          } catch (_) {}
          await setDoc(doc(db, "logins", usuFinal), { email, uid: cred.user.uid, unidade });
        } catch (e2) {
          console.error(e2);
          try { await deleteUser(cred.user); } catch (_) {}
          criandoConta = false; usuario = null;
          btn.disabled = false;
          if (e2 && e2.code === "permission-denied") { aviso(msg, "erro", "Este e-mail não está liberado para acesso."); avisoNaoLiberado(); return; }
          return aviso(msg, "erro", "Não foi possível criar o usuário. Tente novamente em instantes.");
        }
        await updateProfile(cred.user, { displayName: nome });
        await sendEmailVerification(cred.user);
        criandoConta = false; usuario = cred.user;
        telaVerificar(true);
      } else {
        await sendPasswordResetEmail(auth, email);
        aviso(msg, "ok", "Se este e-mail tiver conta, o link de recuperação foi enviado. Confira também o spam.");
        btn.disabled = false;
      }
    } catch (e) {
      console.error(e);
      if (criandoConta) { criandoConta = false; if (auth.currentUser) { try { await deleteUser(auth.currentUser); } catch (_) {} } }
      if (recuperar && e.code === "auth/user-not-found") {
        aviso(msg, "ok", "Se este e-mail tiver conta, o link de recuperação foi enviado. Confira também o spam.");
      } else aviso(msg, "erro", msgErro(e));
      btn.disabled = false;
    }
  });
}

function viewUsuarios() {
  const c = document.getElementById("conteudo");
  c.innerHTML = `
    <section class="card">
      <h2>Liberar novo e-mail</h2>
      <form id="f-liberar" class="grade" novalidate>
        <div><label for="l-nome">Nome (opcional)</label><input id="l-nome" autocomplete="off"></div>
        <div><label for="l-usuario">Usuário (login)</label><input id="l-usuario" autocomplete="off" autocapitalize="none" placeholder="ex.: maria.pezente"></div>
        <div><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="off" required></div>
        <div><label for="l-perfil">Perfil</label>
          <select id="l-perfil">${Object.entries(PERFIS).map(([k, v]) => `<option value="${k}" ${k === "consulta" ? "selected" : ""}>${v}</option>`).join("")}</select></div>
        <div><label for="l-unidade">Unidade</label><select id="l-unidade">${optUnidade("")}</select></div>
        <button class="btn" type="submit">Liberar</button>
      </form>
      <div id="msg-liberar" class="msg" role="alert"></div>
    </section>

    <section class="card">
      <h2>Usuários e e-mails liberados</h2>
      <div class="rolagem" id="tabela"><p class="suave">Carregando…</p></div>
    </section>`;


  let aut = new Map(), usr = new Map(), logs = new Map(); // logs: uid -> nome de usuário
  const pendUn = new Map(); // unidade escolhida e ainda não salva, por e-mail
  const tabela = c.querySelector("#tabela");
  const msgL = c.querySelector("#msg-liberar");

  function linhas() {
    const mapa = new Map();
    aut.forEach((d, email) => mapa.set(email, { email, nome: d.nome || "", usuario: d.usuario || "", perfil: d.perfil, unidade: d.unidade || "", uid: null, cadastrado: false, noAut: true }));
    usr.forEach((u) => {
      const email = String(u.email || "").toLowerCase();
      const base = mapa.get(email) || { email, noAut: false };
      mapa.set(email, { ...base, email, usuario: base.usuario || "", nome: u.nome || base.nome || "", perfil: u.perfil, unidade: u.unidade || base.unidade || "", uid: u.uid, cadastrado: true });
    });
    return [...mapa.values()].sort((a, b) => (a.nome || a.email).localeCompare(b.nome || b.email, "pt-BR"));
  }

  function desenhar() {
    const rs = linhas();
    if (!rs.length) { tabela.innerHTML = `<p class="suave">Nenhum usuário ainda.</p>`; return; }
    tabela.innerHTML = `<table><thead><tr><th>Nome</th><th>Usuário</th><th>E-mail</th><th>Perfil</th><th>Unidade</th><th>Situação</th><th></th></tr></thead><tbody>
      ${rs.map((r) => {
        const eu = r.uid === perfil.uid;
        return `<tr data-email="${esc(r.email)}" data-uid="${esc(r.uid || "")}">
          <td>${esc(r.nome || "—")}${eu ? ' <span class="suave">(você)</span>' : ""}</td>
          <td>${esc((r.uid && logs.get(r.uid)) || r.usuario || "—")}</td>
          <td>${esc(r.email)}</td>
          <td><select data-acao="perfil" ${eu ? "disabled" : ""} aria-label="Perfil de ${esc(r.email)}">
            ${Object.entries(PERFIS).map(([k, v]) => `<option value="${k}" ${k === r.perfil ? "selected" : ""}>${v}</option>`).join("")}</select></td>
          <td><div class="un-cel"><select data-acao="unidade" aria-label="Unidade de ${esc(r.email)}">${optUnidade(pendUn.has(r.email) ? pendUn.get(r.email) : r.unidade)}</select>
            <button class="btn" data-acao="salvar-unidade" ${pendUn.has(r.email) && pendUn.get(r.email) !== (r.unidade || "") ? "" : "disabled"}>Salvar</button></div></td>
          <td><span class="tag ${r.cadastrado ? "tag-ok" : "tag-espera"}">${r.cadastrado ? "Cadastrado" : "Aguardando cadastro"}</span></td>
          <td>${eu ? "" : `<button class="btn btn-perigo" data-acao="remover">Remover acesso</button>`}</td></tr>`;
      }).join("")}</tbody></table>`;
  }

  const falha = (e) => { console.error(e); tabela.innerHTML = `<p class="msg erro" style="display:block">${esc(msgErro(e))}</p>`; };
  desinscrever.push(onSnapshot(collection(db, "logins"), (s) => { logs = new Map(s.docs.map((d) => [d.data().uid, d.id])); desenhar(); }, (e) => { console.warn("Nomes de usuário indisponíveis", e); const m = c.querySelector("#msg-liberar"); if (m) aviso(m, "info", "Não foi possível ler os nomes de usuário já criados (" + (e && e.code ? e.code : "erro") + "). Confira se as regras do Firestore mais recentes foram publicadas."); }));
  desinscrever.push(onSnapshot(collection(db, "autorizados"), (s) => { aut = new Map(s.docs.map((d) => [d.id, d.data()])); desenhar(); }, falha));
  desinscrever.push(onSnapshot(collection(db, "usuarios"), (s) => { usr = new Map(s.docs.map((d) => [d.id, { uid: d.id, ...d.data() }])); desenhar(); }, falha));

  c.querySelector("#f-liberar").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const email = f["l-email"].value.trim().toLowerCase();
    if (!emailValido(email)) return aviso(msgL, "erro", "Informe um e-mail válido.");
    if ([...usr.values()].some((u) => String(u.email).toLowerCase() === email))
      return aviso(msgL, "info", "Este e-mail já está cadastrado. Para mudar o acesso, altere o perfil na tabela.");
    const usu = f["l-usuario"].value.trim().toLowerCase();
    if (usu && !/^[a-z0-9._-]{3,30}$/.test(usu)) return aviso(msgL, "erro", "Usuário inválido. Use de 3 a 30 caracteres: letras minúsculas, números, ponto, hífen ou sublinhado.");
    try {
      if (usu && (await getDoc(doc(db, "logins", usu))).exists()) return aviso(msgL, "erro", "Este nome de usuário já está em uso. Escolha outro.");
      await setDoc(doc(db, "autorizados", email), {
        ...(usu ? { usuario: usu } : {}),
        perfil: f["l-perfil"].value,
        nome: f["l-nome"].value.trim(),
        unidade: f["l-unidade"].value,
        criadoPor: perfil.email,
        criadoEm: serverTimestamp()
      });
      f.reset();
      aviso(msgL, "ok", "E-mail liberado. A pessoa já pode criar a conta com ele.");
    } catch (e) { console.error(e); aviso(msgL, "erro", msgErro(e)); }
  });

  tabela.addEventListener("change", async (ev) => {
    const su = ev.target.closest("select[data-acao=unidade]");
    if (su) {
      const tr = su.closest("tr"); const email = tr.dataset.email;
      pendUn.set(email, su.value);
      const atual = (linhas().find((x) => x.email === email) || {}).unidade || "";
      tr.querySelector("button[data-acao=salvar-unidade]").disabled = su.value === atual;
      return;
    }
    const sel = ev.target.closest("select[data-acao=perfil]");
    if (!sel) return;
    const tr = sel.closest("tr");
    const email = tr.dataset.email, uid = tr.dataset.uid;
    try {
      const b = writeBatch(db);
      if (uid) b.update(doc(db, "usuarios", uid), { perfil: sel.value });
      b.set(doc(db, "autorizados", email), { perfil: sel.value }, { merge: true });
      await b.commit();
      aviso(msgL, "ok", "Perfil atualizado.");
    } catch (e) { console.error(e); aviso(msgL, "erro", msgErro(e)); desenhar(); }
  });

  tabela.addEventListener("click", async (ev) => {
    const bs = ev.target.closest("button[data-acao=salvar-unidade]");
    if (bs) {
      const tr = bs.closest("tr"); const email = tr.dataset.email, uid = tr.dataset.uid;
      const valor = tr.querySelector("select[data-acao=unidade]").value;
      bs.disabled = true;
      try {
        const b = writeBatch(db);
        if (uid) b.update(doc(db, "usuarios", uid), { unidade: valor });
        b.set(doc(db, "autorizados", email), { unidade: valor }, { merge: true });
        await b.commit();
        pendUn.delete(email);
        aviso(msgL, "ok", "Unidade salva.");
      } catch (e) { console.error(e); aviso(msgL, "erro", msgErro(e)); bs.disabled = false; }
      return;
    }
    const bt = ev.target.closest("button[data-acao=remover]");
    if (!bt) return;
    const tr = bt.closest("tr");
    const email = tr.dataset.email, uid = tr.dataset.uid;
    const ok = await confirmar("Remover acesso", `A pessoa ${email} perde o acesso ao sistema e precisará ser liberada de novo para voltar.`, "Remover");
    if (!ok) return;
    try {
      const b = writeBatch(db);
      if (uid) b.delete(doc(db, "usuarios", uid));
      if (aut.has(email)) b.delete(doc(db, "autorizados", email));
      await b.commit();
      aviso(msgL, "ok", "Acesso removido.");
    } catch (e) { console.error(e); aviso(msgL, "erro", msgErro(e)); }
  });
}

/* ============ Fluxo de acesso ============ */
async function obterPerfil(u) {
  const ref = doc(db, "usuarios", u.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return { uid: u.uid, ...snap.data() };
  const email = u.email.toLowerCase();
  const aut = await getDoc(doc(db, "autorizados", email));
  if (!aut.exists()) return null;
  const dados = {
    email,
    nome: u.displayName || aut.data().nome || email,
    perfil: aut.data().perfil,
    criadoEm: serverTimestamp()
  };
  let un = "";
  try { const q = await getDocs(query(collection(db, "logins"), where("uid", "==", u.uid))); if (!q.empty) un = q.docs[0].data().unidade || ""; } catch (_) {}
  if (!UNIDADES.includes(un)) un = aut.data().unidade || "";
  if (UNIDADES.includes(un)) dados.unidade = un;
  await setDoc(ref, dados);
  return { uid: u.uid, ...dados };
}

async function iniciarAcesso(u) {
  limparListeners();
  usuario = u;
  telaCarregando("Verificando seu acesso…");
  try {
    perfil = await obterPerfil(u);
  } catch (e) {
    console.error(e);
    return telaFalha("Não foi possível verificar seu acesso agora. " + msgErro(e));
  }
  if (!perfil || !PERFIS[perfil.perfil]) return telaSemAcesso();
  // Todos os perfis vão direto ao painel da agenda; o Administrador acessa o portal (usuários) por "Voltar ao portal" (?portal=1)
  const meus = MODULOS.filter((m) => (m.perfis || []).includes(perfil.perfil));
  if (meus.length === 1 && !/[?&]portal\b/.test(location.search)) {
    return location.replace(meus[0].url);
  }
  telaApp("inicio");
}

onAuthStateChanged(auth, (u) => {
  if (criandoConta) return;
  limparListeners();
  usuario = u; perfil = null;
  if (!u) { if (root.querySelector("#f-auth")) return; return telaAuth("entrar"); }
  if (!u.emailVerified) return telaVerificar(false);
  iniciarAcesso(u);
});

telaCarregando("Carregando…");
</script>
