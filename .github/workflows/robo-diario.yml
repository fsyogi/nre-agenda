name: Robo diario (e-Protocolo e Diario Oficial)
on:
  schedule:
    - cron: "30 10 * * 1-5"   # 07:30 em Brasilia, de segunda a sexta
  workflow_dispatch:
concurrency:
  group: robo-diario
  cancel-in-progress: false
jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-cloud-firestore==2.19.0
      - run: python robo/robo.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
