name: Avisos automaticos por e-mail
on:
  schedule:
    - cron: "0 11 * * 1-5"   # 08:00 de Brasilia, segunda a sexta
  workflow_dispatch:
    inputs:
      so_testar:
        description: "1 = so mostra o que enviaria, sem enviar nem gravar"
        default: "0"
concurrency:
  group: robo-avisos
  cancel-in-progress: false
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -r robo/requirements.txt
      - run: python robo/avisos.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          AVISOS_SO_TESTAR: ${{ github.event.inputs.so_testar }}
